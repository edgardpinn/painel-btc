  <!-- SCRIPT DOS CARDS — API CoinGecko (100% compatível com GitHub Pages) -->
  <script>
    async function loadBTC() {
      try {
        // Endpoint MAIS estável e sem frescura
        const url = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_market_cap=true&include_24hr_vol=true&include_24hr_change=true";

        const resp = await fetch(url);
        if (!resp.ok) throw new Error("Erro HTTP " + resp.status);

        const data = await resp.json();
        const btc = data.bitcoin;

        const price = btc.usd;
        const change = btc.usd_24h_change;
        const marketcap = btc.usd_market_cap;
        const volume = btc.usd_24h_vol;

        document.getElementById("price").textContent =
          price.toLocaleString("en-US", { style: "currency", currency: "USD" });

        document.getElementById("change24").textContent =
          change.toFixed(2) + "%";

        document.getElementById("marketCap").textContent =
          (marketcap / 1e9).toFixed(1) + " B";

        document.getElementById("volume24").textContent =
          (volume / 1e9).toFixed(1) + " B";

        // Chip verde/vermelho
        const chip = document.getElementById("chip");
        chip.innerHTML = "";
        const span = document.createElement("span");

        span.classList.add("chip");
        span.classList.add(change >= 0 ? "up" : "down");
        span.textContent = change >= 0 ? "Alta nas últimas 24h" : "Queda nas últimas 24h";

        chip.appendChild(span);

      } catch (err) {
        console.error("Erro ao carregar dados:", err);
      }
    }

    loadBTC();
    setInterval(loadBTC, 30000);
  </script>
