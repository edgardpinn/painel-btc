<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Painel Bitcoin - TradingView</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { background: #020617; color: #f9fafb; padding: 16px; font-family: sans-serif; }
    .title { font-size: 1.8rem; font-weight: bold; margin-bottom: 10px; }
    .subtitle { opacity: .8; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="title">Painel Bitcoin · TradingView</div>
  <div class="subtitle">Dados em tempo real via TradingView (BTCUSDT · Binance)</div>

  <div class="tradingview-widget-container">
    <div id="tradingview_btc"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
      new TradingView.widget({
        width: "100%",
        height: 600,
        symbol: "BINANCE:BTCUSDT",
        interval: "60",
        timezone: "Etc/UTC",
        theme: "dark",
        style: "1",
        locale: "br",
        toolbar_bg: "#020617",
        enable_publishing: false,
        allow_symbol_change: true,
        container_id: "tradingview_btc"
      });
    </script>
  </div>
</body>
</html>
