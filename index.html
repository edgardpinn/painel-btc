 <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Painel Bitcoin Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      background: #020617;
      color: #f9fafb;
      padding: 20px;
      font-family: sans-serif;
    }
    .title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .subtitle {
      opacity: .8;
      margin-bottom: 20px;
    }

    /* GRID DE CARDS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .card {
      background: #111827;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .card-title {
      font-size: 0.9rem;
      opacity: 0.8;
    }
    .card-value {
      font-size: 1.4rem;
      font-weight: bold;
      margin-top: 4px;
    }
    .card-sub {
      font-size: 0.8rem;
      margin-top: 4px;
      opacity: 0.8;
    }
    .chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-top: 8px;
    }
    .chip.up {
      background: rgba(22, 163, 74, .12);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, .4);
    }
    .chip.down {
      background: rgba(220, 38, 38, .12);
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, .4);
    }
    .error {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #fecaca;
    }
    a.link-fng {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="title">Painel Bitcoin Pro</div>
  <div class="subtitle">Preço, sentimento de mercado e gráfico profissional</div>

  <!-- CARDS PREÇO / MERCADO -->
  <div class="grid">
    <div class="card">
      <div class="card-title">Preço Atual (USD)</div>
      <div class="card-value" id="price">--</div>
    </div>

    <div class="card">
      <div class="card-title">Variação 24h</div>
      <div class="card-value" id="change24">--</div>
      <div id="chip"></div>
    </div>

    <div class="card">
      <div class="card-title">Market Cap</div>
      <div class="card-value" id="marketCap">--</div>
    </div>

    <div class="card">
      <div class="card-title">Volume 24h</div>
      <div class="card-value" id="volume24">--</div>
    </div>
  </div>

  <!-- FEAR & GREED -->
  <div class="grid">
    <div class="card">
      <div class="card-title">Fear &amp; Greed (Índice)</div>
      <div class="card-value" id="fngValue">--</div>
      <div class="card-sub" id="fngLabel">Carregando sentimento do mercado...</div>
      <div class="card-sub">
        <a class="link-fng" href="https://alternative.me/crypto/fear-and-greed-index/" target="_blank">
          Dados do índice por alternative.me
        </a>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Leitura rápida do momento</div>
      <div class="card-sub" id="fngComment">--</div>
    </div>
  </div>

  <!-- GRAFICO TRADINGVIEW -->
  <div class="tradingview-widget-container">
    <div id="tradingview_btc"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
      new TradingView.widget({
        width: "100%",
        height: 600,
        symbol: "BINANCE:BTCUSDT",
        interval: "60",
        timezone: "Etc/UTC",
        theme: "dark",
        style: "1",
        locale: "br",
        toolbar_bg: "#020617",
        enable_publishing: false,
        allow_symbol_change: true,
        container_id: "tradingview_btc"
      });
    </script>
  </div>

  <div class="error" id="errorBox"></div>

  <!-- SCRIPT DOS CARDS – COINGECKO + FEAR & GREED -->
  <script>
    const priceEl = document.getElementById("price");
    const changeEl = document.getElementById("change24");
    const marketCapEl = document.getElementById("marketCap");
    const volumeEl = document.getElementById("volume24");
    const chipEl = document.getElementById("chip");
    const errorBoxEl = document.getElementById("errorBox");

    const fngValueEl = document.getElementById("fngValue");
    const fngLabelEl = document.getElementById("fngLabel");
    const fngCommentEl = document.getElementById("fngComment");

    function formatUSD(v) {
      return Number(v).toLocaleString("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 2
      });
    }

    function formatBigUSD(v) {
      const n = Number(v);
      if (n >= 1e12) return (n / 1e12).toFixed(2) + " T";
      if (n >= 1e9) return (n / 1e9).toFixed(2) + " B";
      if (n >= 1e6) return (n / 1e6).toFixed(2) + " M";
      return n.toLocaleString("en-US", { maximumFractionDigits: 0 });
    }

    // --- BTC PRICE / MARKET DATA (COINGECKO) ---
    async function loadBTC() {
      try {
        errorBoxEl.textContent = "";

        const url =
          "https://api.coingecko.com/api/v3/simple/price" +
          "?ids=bitcoin" +
          "&vs_currencies=usd" +
          "&include_market_cap=true" +
          "&include_24hr_vol=true" +
          "&include_24hr_change=true";

        const resp = await fetch(url);
        if (!resp.ok) throw new Error("HTTP " + resp.status);

        const data = await resp.json();
        const btc = data.bitcoin;

        const price = btc.usd;
        const change = btc.usd_24h_change;
        const marketcap = btc.usd_market_cap;
        const volume = btc.usd_24h_vol;

        priceEl.textContent = formatUSD(price);
        changeEl.textContent = change.toFixed(2) + "%";
        marketCapEl.textContent = formatBigUSD(marketcap);
        volumeEl.textContent = formatBigUSD(volume);

        chipEl.innerHTML = "";
        const span = document.createElement("span");
        span.classList.add("chip");
        span.classList.add(change >= 0 ? "up" : "down");
        span.textContent =
          change >= 0 ? "Alta nas últimas 24h" : "Queda nas últimas 24h";
        chipEl.appendChild(span);
      } catch (err) {
        console.error("Erro ao buscar dados BTC:", err);
        errorBoxEl.textContent =
          "Erro ao buscar dados da API (CoinGecko). Pode ser limite da API ou problema de conexão.";
      }
    }

    // --- FEAR & GREED (ALTERNATIVE.ME) ---
    function gerarComentarioFNG(valor, classificacao) {
      const v = Number(valor);
      if (v <= 20) {
        return "Medo extremo: mercado bem tenso, crowd pessimista. Geralmente é onde quem pensa no longo prazo começa a montar posição.";
      } else if (v <= 40) {
        return "Medo: investidores mais defensivos, menos apetite a risco. Bons pontos pra comprar com calma, mas sem pressa.";
      } else if (v < 60) {
        return "Neutro: mercado sem emoção forte. Normalmente bom para observar e se posicionar com critério, sem FOMO.";
      } else if (v < 80) {
        return "Ganância: apetite a risco maior, normalmente com muita confiança em alta. Fica atento a alavancagem e correções.";
      } else {
        return "Ganância extrema: euforia forte, risco alto de correção brusca. Hora de ter disciplina, não emoção.";
      }
    }

    async function loadFNG() {
      try {
        const url = "https://api.alternative.me/fng/?limit=1&format=json";
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("HTTP " + resp.status);

        const json = await resp.json();
        const item = json.data[0];

        const value = Number(item.value);
        const classification = item.value_classification;

        fngValueEl.textContent = value;
        fngLabelEl.textContent = classification;
        fngCommentEl.textContent = gerarComentarioFNG(value, classification);
      } catch (err) {
        console.error("Erro ao buscar Fear & Greed:", err);
        fngLabelEl.textContent = "Erro ao carregar índice de sentimento.";
        fngCommentEl.textContent = "Possível instabilidade na API do Fear & Greed ou bloqueio de rede.";
      }
    }

    // disparo inicial
    loadBTC();
    loadFNG();

    // atualiza preço a cada 30s, Fear & Greed a cada 15min (ele só muda 1x por dia mesmo)
    setInterval(loadBTC, 30000);
    setInterval(loadFNG, 15 * 60 * 1000);
  </script>

</body>
</html>
